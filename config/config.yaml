# REST API Ingestion Parameters
api:
  tomtom:
    base_url: "https://api.tomtom.com/traffic/services/4/flowSegmentData/absolute/10/json"
    unit: "KMPH"
    poll_interval_seconds: 60
  openweather:
    weather_base_url: "https://api.openweathermap.org/data/2.5/weather"
    aqi_base_url: "https://api.openweathermap.org/data/2.5/air_pollution"
    units: "metric"
    poll_interval_seconds: 60

# Apache Kafka Configuration
kafka:
  bootstrap_servers: "13.217.6.185:9092"
  topics:
    traffic_raw: "mumbai-traffic-events"
    weather_raw: "mumbai-weather-events"
    aqi_raw: "mumbai-aqi-events"
  producer:
    acks: "all"
    retries: 3
    batch_size: 16384
    linger_ms: 100

# Apache Spark Stream & Storage Settings
spark:
  app_name: "UrbanPulseSparkETL"
  master: "local[*]"
  driver_memory: "2g"
  executor_memory: "2g"
  streaming:
    trigger_interval: "10 seconds"
    checkpoint_dir: "data/checkpoints"

# Medallion Architecture Storage Paths
storage:
  local:
    bronze_dir: "data/bronze"
    silver_dir: "data/silver"
    gold_dir: "data/gold"
  s3:
    bronze_prefix: "bronze/"
    silver_prefix: "silver/"
    gold_prefix: "gold/"

# Machine Learning Parameters
ml:
  random_forest_regressor:
    n_estimators: 100
    max_depth: 12
    random_state: 42
  xgboost_regressor:
    n_estimators: 150
    learning_rate: 0.05
    max_depth: 6
    random_state: 42
