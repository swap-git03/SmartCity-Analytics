app:
  name: "SmartCityTrafficAnalytics"
  version: "1.0.0"
  environment: "development"

# Target Cities / Geofence coordinates
cities:
  - name: "New York"
    lat: 40.7128
    lon: -74.0060
    zoom: 10
  - name: "London"
    lat: 51.5074
    lon: -0.1278
    zoom: 10
  - name: "Mumbai"
    lat: 19.0760
    lon: 72.8777
    zoom: 10

# REST API Ingestion Parameters
api:
  tomtom:
    base_url: "https://api.tomtom.com/traffic/services/4/flowSegmentData/absolute/10/json"
    unit: "KMPH"
    poll_interval_seconds: 60
  openweather:
    weather_base_url: "https://api.openweathermap.org/data/2.5/weather"
    aqi_base_url: "https://api.openweathermap.org/data/2.5/air_pollution"
    units: "metric"
    poll_interval_seconds: 60

# Apache Kafka Configuration
kafka:
  bootstrap_servers: "localhost:9092"
  topics:
    traffic_raw: "traffic-raw-events"
    weather_raw: "weather-raw-events"
    aqi_raw: "aqi-raw-events"
  producer:
    acks: "all"
    retries: 3
    batch_size: 16384
    linger_ms: 100

# Apache Spark Stream & Storage Settings
spark:
  app_name: "SmartCityStreamingETL"
  master: "local[*]"
  driver_memory: "2g"
  executor_memory: "2g"
  streaming:
    trigger_interval: "10 seconds"
    checkpoint_dir: "data/checkpoints"

# Medallion Architecture Storage Paths
storage:
  local:
    bronze_dir: "data/bronze"
    silver_dir: "data/silver"
    gold_dir: "data/gold"
  s3:
    bronze_prefix: "bronze/"
    silver_prefix: "silver/"
    gold_prefix: "gold/"

# Machine Learning Parameters
ml:
  random_forest:
    n_estimators: 100
    max_depth: 15
    random_state: 42
  xgboost:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 6
    random_state: 42
